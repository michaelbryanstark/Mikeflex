{% extends 'base.html' %}
{% block title %}Admin - Mikeflix{% endblock %}
{% block body %}
<div class="admin-shell">
  <aside class="sidebar">
    <h3>Overview</h3>
    <a href="{{ url_for('admin_home') }}" class="{{ 'active' if active == 'home' }}">Dashboard</a>
    <a href="{{ url_for('admin_analytics') }}" class="{{ 'active' if active == 'analytics' }}">Analytics</a>
    <h3>Tables</h3>
    {% for t in tables %}
    <a href="{{ url_for('admin_table', table=t) }}" class="{{ 'active' if active == t }}">{{ t }}</a>
    {% endfor %}
    <h3>Site</h3>
    <a href="{{ url_for('home') }}">← Back to Mikeflix</a>
  </aside>
  <div class="admin-main">{% block admin %}{% endblock %}</div>
</div>
{% endblock %}
