{% from '_macros.html' import csrf_field %}
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in - Team Netflix</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body>
<div class="auth">
  <form class="auth-card" method="post" autocomplete="on">
    <span class="brand">TEAM NETFLIX</span>
    <h1 style="font-size:1.5rem;margin-top:0">Sign in</h1>
    {% for category, msg in get_flashed_messages(with_categories=true) %}
      <div class="flash {{ 'ok' if category == 'ok' }}" role="alert">{{ msg }}</div>
    {% endfor %}
    {{ csrf_field() }}
    <div class="field"><label for="email">Email</label>
      <input id="email" name="email" type="email" required autofocus value="{{ request.form.get('email','') }}"></div>
    <div class="field"><label for="password">Password</label>
      <input id="password" name="password" type="password" required></div>
    <button class="btn" type="submit">Sign in</button>
    <p class="muted" style="text-align:center;margin:1rem 0 0">New to Team Netflix? <a href="{{ url_for('signup') }}" style="color:var(--text)">Sign up now</a></p>
  </form>
</div>
</body></html>
